# .github/workflows/ci.yml
# Continuous Integration - Run tests on every push and PR

name: CI - Test & Build       # ← What shows up in GitHub UI

on:                           # ← When to run the workflow
  push:                       # ← Trigger event
    branches: [ main, develop ]
  pull_request:               # ← Trigger event
    branches: [ main, develop ]

jobs:                         # ← What to do
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Run Tests
  # ═══════════════════════════════════════════════════════════
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      JWT_SECRET: test-jwt-secret-key
      JWT_EXPIRE: 30d
      SESSION_SECRET: test-session-secret-key
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🗄️ Run migrations
        working-directory: ./backend
        run: npx sequelize-cli db:migrate

      - name: 🌱 Seed database
        working-directory: ./backend
        run: npx sequelize-cli db:seed:all

      - name: 🧪 Run unit tests
        working-directory: ./backend
        run: npm run test --if-present
        continue-on-error: true
